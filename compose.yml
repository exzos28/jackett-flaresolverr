# Jackett with FlareSolverr for the indexers behind Cloudflare, behind Caddy for a short address.
# Only Caddy is published (http://localhost:9117): /torznab is Jackett's all-indexers Torznab
# endpoint, everything else is Jackett as it is. FlareSolverr is reachable from Jackett alone, on
# the compose network, at http://flaresolverr:8191.
services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    environment:
      - TZ=${TZ:-Europe/Warsaw}
      - AUTO_UPDATE=true
      # FlareSolverr in Jackett's settings, written by init/flaresolverr.sh before each start
      - FLARESOLVERR_URL=http://flaresolverr:8191
      - FLARESOLVERR_TIMEOUT=120000
    volumes:
      - ./config:/config
      - ./init:/custom-cont-init.d:ro
    depends_on:
      - flaresolverr
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${JACKETT_PORT:-9117}:80"
    depends_on:
      - jackett
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - TZ=${TZ:-Europe/Warsaw}
      # warning: info would write request bodies, logins and passwords included, to the log
      - LOG_LEVEL=warning
    restart: unless-stopped
